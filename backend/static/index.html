<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intra - LAN Messenger</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="brand-title">Intra</h1>
            <p class="brand-subtitle">LAN Messenger</p>

            <div id="auth-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>

                <button id="auth-btn" onclick="handleAuth()">LOGIN</button>

                <p class="toggle-text">
                    <span id="toggle-msg">No account?</span>
                    <a href="#" id="toggle-link" onclick="toggleAuthMode()">Register</a>
                </p>

                <p id="error" class="error-msg"></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Password toggle logic
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
