<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intra Web</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="sidebar">
        <div id="my-profile">
            <div id="my-profile-info">
                <span id="profile-name">loading...</span>
            </div>
            <div class="profile-actions">
                <button id="sidebar-toggle" onclick="toggleSidebar()" title="Toggle Sidebar">↔️</button>
                <button id="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
                <button onclick="toggleSettings()" style="background: transparent; border: none; font-size: 18px; cursor: pointer;" title="Settings">⚙️</button>
            </div>
        </div>
        <div id="settings-panel">
            <img id="my-avatar" src="https://via.placeholder.com/80" alt="Profile">
            <input type="file" id="photo-input" style="display:none" accept="image/*" onchange="uploadPhoto()">

            <div class="settings-option">
                <label class="switch-label">
                    <span>Show Lumir AI Assistant</span>
                    <input type="checkbox" id="lumir-toggle" onchange="toggleLumirVisibility()">
                </label>
            </div>

            <button onclick="document.getElementById('photo-input').click()">Change Photo</button>
            <button onclick="logout()">Logout</button>
            <button class="btn-delete" onclick="deleteAccount()">Delete Account</button>
        </div>
        <div id="user-list"></div>
    </div>

    <div id="chat-area">
        <div id="chat-header">
            <button id="back-btn" onclick="showSidebar()" style="display: none; background: transparent; border: none; font-size: 20px; cursor: pointer; margin-right: 10px; color: var(--text-primary);">⬅️</button>
            <span id="chat-title">Select a user to chat</span>
            <div id="chat-actions" style="display: none;">
                <button onclick="startCall()" style="background: transparent; border: none; font-size: 20px; cursor: pointer;" title="Voice Call">📞</button>
            </div>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <button onclick="document.getElementById('file-input').click()" style="background: transparent; color: var(--text-secondary); font-size: 20px; border: none; cursor: pointer;">📎</button>
            <input type="file" id="file-input" style="display:none" onchange="sendFile()">
            <input id="msg" placeholder="Type something..." onkeypress="handleEnter(event)">
            <button onclick="sendMsg()" style="background: transparent; padding: 0; color: var(--primary-color); border: none; cursor: pointer;">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <!-- Call Overlay -->
    <div id="call-overlay" class="overlay" style="display: none;">
        <div class="call-card">
            <img id="call-avatar" src="https://via.placeholder.com/100" class="call-avatar">
            <h2 id="call-username">Incoming Call...</h2>
            <p id="call-status">Ringing...</p>
            <div class="call-buttons">
                <button id="accept-call" class="btn-call accept" onclick="acceptCall()">📞 Accept</button>
                <button id="reject-call" class="btn-call reject" onclick="rejectCall()">🛑 Decline</button>
                <button id="end-call" class="btn-call reject" onclick="endCall()" style="display: none;">🛑 End Call</button>
            </div>
        </div>
    </div>

    <audio id="ringtone" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" loop></audio>

    <script src="app.js?v=2"></script>
</body>
</html>
