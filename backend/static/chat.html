<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intra Web</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="sidebar">
        <div id="my-profile">
            <span id="profile-name">loading...</span>
            <div style="display: flex; align-items: center;">
                <button id="theme-toggle" onclick="toggleTheme()">🌓</button>
                <button onclick="toggleSettings()" style="background: transparent; border: none; font-size: 18px; cursor: pointer;">⚙️</button>
            </div>
        </div>
        <div id="settings-panel">
            <img id="my-avatar" src="https://via.placeholder.com/80" alt="Profile">
            <input type="file" id="photo-input" style="display:none" accept="image/*" onchange="uploadPhoto()">
            <button onclick="document.getElementById('photo-input').click()">Change Photo</button>
            <button onclick="logout()">Logout</button>
            <button class="btn-delete" onclick="deleteAccount()">Delete Account</button>
        </div>
        <div id="user-list"></div>
    </div>

    <div id="chat-area">
        <div id="chat-header">Select a user to chat</div>
        <div id="messages"></div>
        <div id="input-area">
            <button onclick="document.getElementById('file-input').click()" style="background: transparent; color: var(--text-secondary); font-size: 20px; border: none; cursor: pointer;">📎</button>
            <input type="file" id="file-input" style="display:none" onchange="sendFile()">
            <input id="msg" placeholder="Type something..." onkeypress="handleEnter(event)">
            <button onclick="sendMsg()" style="background: transparent; padding: 0; color: var(--primary-color); border: none; cursor: pointer;">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
