<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intra Web</title>
    <link rel="icon" type="image/x-icon" href="/assets/intra_logo/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/intra_logo/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/assets/intra_logo/apple-touch-icon.png">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/chat-layout.css">
    <link rel="stylesheet" href="css/chat-components.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div id="sidebar">
        <div id="my-profile">
            <div id="my-profile-info">
                <img id="my-profile-thumb" src="/assets/lumir5.svg" class="mini-avatar" alt="Avatar">
                <span id="profile-name">loading...</span>
            </div>
            <div class="profile-actions">
                <button id="btn-open-drop" class="icon-btn" title="🚀 Open WebDrop (LAN Share)">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="drop-grad" x1="4" y1="4" x2="20" y2="20"><stop stop-color="var(--brand)"/><stop offset="1" stop-color="var(--accent-pink)"/></linearGradient></defs><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09zM12 15l-3-3m3 3 7.5-7.5a3.54 3.54 0 0 0 0-5 3.54 3.54 0 0 0-5 0L7 10m5 5-2 2m5-5 2-2" stroke="url(#drop-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button id="sidebar-toggle" class="icon-btn" title="Toggle Sidebar">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="panel-gradient" x1="3" y1="4" x2="21" y2="20"><stop stop-color="var(--brand)"/><stop offset="1" stop-color="var(--accent-pink)"/></linearGradient></defs><rect x="3" y="4" width="18" height="16" rx="3" stroke="url(#panel-gradient)" stroke-width="1.8"/><path d="M9 4v16M13 9l-2.5 3 2.5 3" stroke="url(#panel-gradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="theme-gradient" x1="4" y1="4" x2="20" y2="20"><stop stop-color="var(--brand)"/><stop offset="1" stop-color="var(--accent-pink)"/></linearGradient></defs><path d="M17.8 15.2A7.3 7.3 0 0 1 8.8 6.2a7.5 7.5 0 1 0 9 9Z" stroke="url(#theme-gradient)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="16.5" cy="7.5" r="2" stroke="url(#theme-gradient)" stroke-width="1.5"/><path d="M16.5 3.8v1M16.5 10.2v1M12.8 7.5h1M19.2 7.5h1" stroke="url(#theme-gradient)" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
                <button id="btn-open-settings" class="icon-btn" title="Settings">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="gear-gradient" x1="4" y1="3" x2="20" y2="21"><stop stop-color="var(--brand)"/><stop offset="1" stop-color="var(--accent-pink)"/></linearGradient></defs><path d="m10.2 3.8.4-1h2.8l.4 1a2 2 0 0 0 2.8 1.2l1-.5 2 2-.5 1a2 2 0 0 0 1.2 2.8l1 .4v2.8l-1 .4a2 2 0 0 0-1.2 2.8l.5 1-2 2-1-.5a2 2 0 0 0-2.8 1.2l-.4 1h-2.8l-.4-1a2 2 0 0 0-2.8-1.2l-1 .5-2-2 .5-1a2 2 0 0 0-1.2-2.8l-1-.4v-2.8l1-.4a2 2 0 0 0 1.2-2.8l-.5-1 2-2 1 .5a2 2 0 0 0 2.8-1.2Z" transform="translate(-1 -1) scale(1.08)" stroke="url(#gear-gradient)" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="url(#gear-gradient)" stroke-width="1.8"/></svg>
                </button>
            </div>
        </div>
        <div id="search-container">
            <input type="text" id="user-search" placeholder="Search user by name...">
        </div>
        <div id="user-list"></div>
    </div>

    <!-- Centered Glassmorphic Settings Modal -->
    <div id="settings-overlay" class="modal-backdrop" style="display:none;">
        <div id="settings-panel" class="settings-modal">
            <div class="settings-header">
                <h3>Account & Preferences</h3>
                <button id="btn-close-settings" class="modal-close-btn">&times;</button>
            </div>

            <div class="settings-profile-section">
                <div class="avatar-upload-wrapper">
                    <img id="my-avatar" src="https://via.placeholder.com/80" alt="Profile">
                    <button id="btn-avatar-edit" class="avatar-edit-badge" title="Change Photo">📷</button>
                </div>
                <input type="file" id="photo-input" style="display:none" accept="image/*">
                <div id="settings-username-display" class="settings-uname">User</div>
            </div>

            <div class="settings-option">
                <label class="switch-label">
                    <span>Show Lumir AI Assistant</span>
                    <input type="checkbox" id="lumir-toggle">
                </label>
            </div>

            <div class="settings-actions-grid">
                <button id="btn-settings-drop" class="btn-subtle">🚀 Open WebDrop</button>
                <button id="btn-settings-photo" class="btn-subtle">Change Photo</button>
                <button id="btn-logout" class="btn-subtle">Logout</button>
                <button id="btn-delete-account" class="btn-delete">Delete Account</button>
            </div>
        </div>
    </div>

    <div id="chat-area">
        <div id="chat-header">
            <button id="back-btn" class="icon-btn" style="display: none;" title="Back">
                <svg class="nav-svg" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="header-user-info">
                <img id="header-avatar" src="/assets/family_group.svg" class="header-avatar" alt="Chat Avatar">
                <div class="header-text-details">
                    <div class="header-title-row">
                        <span id="chat-title">Select a user to chat</span>
                    </div>
                    <span id="header-subtitle" class="header-subtitle">Intra Local Network</span>
                </div>
            </div>
            <div id="chat-actions" style="display: none;">
                <button id="btn-call" class="icon-btn-highlight" title="Voice Call">
                    <svg class="nav-svg" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="call-gradient" x1="4" y1="4" x2="20" y2="20"><stop stop-color="var(--brand)"/><stop offset="1" stop-color="var(--accent-pink)"/></linearGradient></defs><path d="M7.2 3.8 10 7.5 8.2 9.3a14.2 14.2 0 0 0 6.5 6.5l1.8-1.8 3.7 2.8-.8 3a1.7 1.7 0 0 1-1.8 1.2A17.5 17.5 0 0 1 3 6.4a1.7 1.7 0 0 1 1.2-1.8l3-0.8Z" stroke="url(#call-gradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 4.5a5 5 0 0 1 5 5M14.5 7.5a2 2 0 0 1 2 2" stroke="url(#call-gradient)" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>

        <div id="messages"></div>

        <div id="input-container-wrapper">
            <div id="input-area" class="chat-input-pill">
                <button id="btn-attach" type="button" class="pill-attachment-btn" title="Attach File / Photo">
                    <svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="clip-gradient" x1="5" y1="4" x2="19" y2="20"><stop stop-color="var(--brand)"/><stop offset="1" stop-color="var(--accent-pink)"/></linearGradient></defs><path d="m9 12.8 6.4-6.4a3.2 3.2 0 0 1 4.5 4.5l-8.1 8.1a5 5 0 0 1-7.1-7.1l8.1-8.1" stroke="url(#clip-gradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m8.2 15.6 7.1-7.1" stroke="url(#clip-gradient)" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
                <input type="file" id="file-input" style="display:none">
                <input id="msg" placeholder="Type a message...">
                <button id="btn-send" type="button" class="pill-send-btn" title="Send">
                    <svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="send-gradient" x1="3" y1="4" x2="21" y2="20"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#fdf4ff"/></linearGradient></defs><path d="m3 11 17-7-6.8 17-3.1-7.1L3 11Z" stroke="url(#send-gradient)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m10.1 13.9 4.2-4.2M2.5 7.5l2 .8M2 15l2.2-.1" stroke="url(#send-gradient)" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Call Overlay -->
    <div id="call-overlay" class="overlay" style="display: none;">
        <div class="call-card">
            <img id="call-avatar" src="https://via.placeholder.com/100" class="call-avatar">
            <h2 id="call-username">Incoming Call...</h2>
            <p id="call-status">Ringing...</p>
            <div class="call-buttons">
                <button id="accept-call" class="btn-call accept">📞 Accept</button>
                <button id="reject-call" class="btn-call reject">🛑 Decline</button>
                <button id="end-call" class="btn-call reject" style="display: none;">🛑 End Call</button>
            </div>
        </div>
    </div>

    <audio id="ringtone" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" loop></audio>

    <script type="module" src="js/chat/main.js"></script>
</body>
</html>
